name: 'PlanMe - Backlog automation'
author: 'Kevin de Jong'
description: >
  Keep your GitHub Issues and Projects v2 backlog consistent: deterministic, no AI.

branding:
  icon: 'list'
  color: 'white'

inputs:
  token:
    description: 'GitHub token used to access GitHub (needs issues:write and Projects access)'
    required: false
    default: ${{ github.token }}

  config:
    description: 'Path to the configuration file; by default ".plan-me.json" is used.'
    required: false
    default: '.plan-me.json'

  issue-check:
    description: >
      Check the text of opened and edited issues (type, the sections of the type, the prose with Vale): annotations
      and one comment on the issue listing the problems. "false" turns it off.
    required: false
    default: 'true'

  issue-check-label:
    description: 'A label added to issues that fail the issue check (removed once they pass); empty: no label.'
    required: false
    default: ''

outputs:
  changes:
    description: 'The changes made, as a JSON list of lines (e.g. ["#12 in-progress (#40)"])'

runs:
  using: 'node24'
  main: 'lib/action/index.js'
