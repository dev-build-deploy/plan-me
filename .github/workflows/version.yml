---

name: Version

# release-me tags every push to main from the Conventional Commits but writes no files: a pull request must carry the
# version it will release in package.json, package-lock.json and the Claude Code plugin's plugin.json.
on:
  pull_request:

jobs:
  version:
    name: Version files match the next release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Check the version files
        run: npm run test:version
