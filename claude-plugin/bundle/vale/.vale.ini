# The Vale configuration plan-me's issue check ships.
#
# styles/DevBuildDeploy/ and glossary.md are copies of pull-me's (https://github.com/dev-build-deploy/pull-me, its
# vale/ folder, at commit c684e99): the organization's prose rules, so an issue is held to the same bar as a pull
# request description. Change them in pull-me first and copy them here again; do not edit them here.
# styles/PlanMe/ holds plan-me's own rules for issues.
#
# plan-me copies the styles next to a copy of this file for each run and fills in the glossary terms, the reference
# patterns and the known abbreviations (as pull-me does).
StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = DevBuildDeploy, PlanMe
DevBuildDeploy.Readability = NO
