# The Flesch-Kincaid grade level. Technical words have many syllables, so the score punishes every technical pull
# request: the default .vale.ini switches this rule off. A repository can turn it on in .pull-me.json.
extends: metric
message: "Try to keep the Flesch-Kincaid grade level (%s) below 12."
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests
level: warning
formula: |
  (0.39 * (words / sentences)) + (11.8 * (syllables / words)) - 15.59
condition: "> 12"
