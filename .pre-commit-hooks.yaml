- id: plan-me-decisions
  name: PlanMe - Decisions check
  description: Fails when a decision file in docs/decisions/ is invalid, ids collide or docs/decisions.md is stale
  entry: plan-me decisions check
  language: node
  pass_filenames: false
  files: ^docs/decisions

- id: plan-me-claude
  name: PlanMe - Claude Code plugin check
  description: Fails when a repository with .plan-me.json does not enable the plan-me Claude Code plugin in .claude/settings.json
  entry: plan-me claude check
  language: node
  pass_filenames: false
  always_run: true
